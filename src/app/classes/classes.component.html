<section data-testid="classes-page">
  <h2>Choose a Character Class</h2>

  <div data-testid="class-list">
    @for (characterClass of characterClasses; track characterClass.id) {
      <article>
        <h3>{{ characterClass.name }}</h3>

        <p>{{ characterClass.description }}</p>

        <a [routerLink]="['/classes', characterClass.id]">
          View details →
        </a>
      </article>
    }
  </div>
</section>
